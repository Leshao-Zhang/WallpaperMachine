# Build the Release app on macOS, prove what was built, and attach its disk images to the
# tag's GitHub Release.
#
# Called by Version right after it pushes a bump tag, and by Release for hand-pushed
# tags. Version has to call it directly: a tag pushed with GITHUB_TOKEN never starts
# another workflow, so Release alone would never run for CI-produced tags.
# workflow_dispatch builds both images and uploads them as artifacts without publishing,
# so the Intel image can be checked without cutting a release.
#
# `app-icon` compiles the Icon Composer icon on macOS 26, because Xcode 26's actool
# crashes on most attempts to compile an .icon on macOS 15. `notes` writes the release
# body once. `build` then makes two native Release images from that icon and changelog:
# arm64 on macos-15, and x86_64 on macos-15-intel. The project builds whatever CPU the
# runner is, so the Intel image is not a cross-compile. `test` runs the gate on macOS 26
# while those builds run. `publish` needs every one of them, and uploads both images.
# The release is created as a draft and published only after the images it needs are
# uploaded, so the in-app updater never sees a "latest" release with nothing to download.
# Everything published is derived from the build or recorded at the tag: the notes from
# the tag's bilingual CHANGELOG.md section (generated once into that file when the tag
# has none), the checksums and the update manifest from the images, the provenance
# attestation from this run.
name: Build

on:
  workflow_call:
    inputs:
      tag:
        description: "Version tag to build and publish."
        required: true
        type: string
      validate_only:
        description: "Build and upload the disk images without publishing a release."
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      validate_only:
        description: "Build and upload the disk images without publishing a release."
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  app-icon:
    # A few seconds of actool, but it has to be macOS 26: on macOS 15, Xcode 26's actool
    # (every 26.x on the runner image) exits 255 on most .icon compiles. The asset
    # catalog alone compiles there reliably, so `build` still compiles that itself.
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}

      - name: Compile the app icon
        run: |
          set -euo pipefail
          # shellcheck disable=SC2010 # Xcode bundle names carry no odd characters
          xcode="$(ls -d /Applications/Xcode_26*.app | grep -iv beta | sort -V | tail -n 1)"
          sudo xcode-select -s "${xcode}"
          python3 scripts/build.py --compile-app-icon "${RUNNER_TEMP}/app-icon"

      - uses: actions/upload-artifact@v4
        with:
          name: app-icon-${{ inputs.tag || github.run_id }}
          path: ${{ runner.temp }}/app-icon/
          if-no-files-found: error
          retention-days: 7

  notes:
    # Once, before either architecture builds. A hand-pushed tag with no bilingual
    # section asks the model and writes that section into CHANGELOG.md; both builds
    # have to bundle that same file. A validation run keeps the changelog already
    # in the tree and does not need a tag or the notes key.
    if: ${{ inputs.validate_only == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Write the release notes
        env:
          TAG: ${{ inputs.tag }}
          RELEASE_NOTES_API_KEY: ${{ secrets.RELEASE_NOTES_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/release"
          python3 scripts/release_notes.py --tag "$TAG" --release-body --ai \
            --built-from "$(git rev-parse HEAD)" --output "${RUNNER_TEMP}/release/notes.md"
          cp CHANGELOG.md "${RUNNER_TEMP}/release/CHANGELOG.md"
          cat "${RUNNER_TEMP}/release/notes.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ inputs.tag }}-notes
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build (${{ matrix.arch }})
    needs: [app-icon, notes]
    # A skipped notes job is the validation run. A failed one must not build.
    if: ${{ always() && needs.app-icon.result == 'success' && (needs.notes.result == 'success' || needs.notes.result == 'skipped') }}
    # macos-15 is the oldest runner that carries Xcode 26. Homebrew pours bottles
    # built for the runner's own release, and the app bundles those dylibs, so that
    # macOS is the lowest release the published app can launch on (docs/build.md).
    # The Intel image uses the same OS generation on a native x86_64 runner:
    # project.yml builds $(NATIVE_ARCH_ACTUAL), and cargo and Homebrew follow the host.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        if: ${{ inputs.validate_only == false }}
        with:
          name: release-${{ inputs.tag }}-notes
          path: ${{ runner.temp }}/notes

      - name: Bundle the shared changelog
        if: ${{ inputs.validate_only == false }}
        run: cp "${RUNNER_TEMP}/notes/CHANGELOG.md" CHANGELOG.md

      - uses: ./.github/actions/prepare-build

      - uses: actions/download-artifact@v4
        with:
          name: app-icon-${{ inputs.tag || github.run_id }}
          path: ${{ runner.temp }}/app-icon

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild -version
          python3 scripts/build.py --configuration Release --app-icon "${RUNNER_TEMP}/app-icon"

      - name: Import the signing certificate
        id: signing
        # The project certificate, not ad hoc, keeps the app's designated requirement the
        # same from one release to the next, so macOS keeps its privacy permissions after an
        # in-app update (docs/build.md). A missing secret fails a release instead of shipping
        # an ad-hoc build that would drop those permissions again. A validation run may
        # sign ad hoc: it uploads artifacts and does not publish.
        env:
          SIGNING_CERTIFICATE_P12: ${{ secrets.SIGNING_CERTIFICATE_P12 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
          VALIDATE_ONLY: ${{ inputs.validate_only }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_CERTIFICATE_P12}" ] || [ -z "${SIGNING_CERTIFICATE_PASSWORD}" ]; then
            if [ "${VALIDATE_ONLY}" = "true" ]; then
              echo "identity=-" >> "$GITHUB_OUTPUT"
              echo "No signing certificate; this validation run signs ad hoc and is not published."
              exit 0
            fi
            echo "::error::SIGNING_CERTIFICATE_P12 and SIGNING_CERTIFICATE_PASSWORD must be set (docs/build.md#release-signing)."
            exit 1
          fi
          keychain="${RUNNER_TEMP}/signing.keychain-db"
          certificate="${RUNNER_TEMP}/signing.p12"
          password="$(openssl rand -hex 24)"
          printf '%s' "${SIGNING_CERTIFICATE_P12}" | base64 -d > "${certificate}"
          security create-keychain -p "${password}" "${keychain}"
          security set-keychain-settings -lut 21600 "${keychain}"
          security unlock-keychain -p "${password}" "${keychain}"
          security import "${certificate}" -k "${keychain}" -P "${SIGNING_CERTIFICATE_PASSWORD}" -T /usr/bin/codesign
          rm -f "${certificate}"
          # Lets codesign use the key without a keychain prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${password}" "${keychain}" > /dev/null
          # shellcheck disable=SC2046 # keychain paths carry no spaces on the runner
          security list-keychains -d user -s "${keychain}" $(security list-keychains -d user | tr -d '"')
          echo "identity=WallpaperMachine Code Signing" >> "$GITHUB_OUTPUT"

      - name: Package
        # Relocates and signs the bundle, wraps it in the drag-to-install disk image,
        # mounts that image to check the app's identifier, version, signature and the
        # Applications link, and writes the .sha256 sidecar (docs/build.md).
        env:
          SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
        run: |
          python3 scripts/package.py --configuration Release --require-deployment-target \
            --sign-identity "${SIGN_IDENTITY}"

      - name: Match the disk image to the tag
        env:
          TAG: ${{ inputs.tag }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          directory="build/Build/Products/Release"
          app="${directory}/WallpaperMachine.app/Contents/MacOS/WallpaperMachine"
          extension="${directory}/WallpaperMachine.app/Contents/Extensions/WallpaperMachineExtension.appex/Contents/MacOS/WallpaperMachineExtension"
          if [ "$(uname -m)" != "${ARCH}" ]; then
            echo "::error::This runner is $(uname -m), not ${ARCH}."
            exit 1
          fi
          for binary in "${app}" "${extension}"; do
            slices="$(lipo -archs "${binary}")"
            if [ "${slices}" != "${ARCH}" ]; then
              echo "::error::${binary} is ${slices}, not ${ARCH}."
              exit 1
            fi
          done
          slices="${ARCH}"
          if [ -n "${TAG}" ]; then
            name="WallpaperMachine-${TAG#v}-${ARCH}.dmg"
          else
            shopt -s nullglob
            found=("${directory}/WallpaperMachine-"*"-${ARCH}.dmg")
            if [ "${#found[@]}" -ne 1 ]; then
              echo "::error::Expected one ${ARCH} disk image in ${directory}."
              ls -1 "${directory}"/*.dmg 2>/dev/null || true
              exit 1
            fi
            name="$(basename "${found[0]}")"
          fi
          if [ ! -f "${directory}/${name}" ]; then
            echo "::error::No ${name} in ${directory}. scripts/package.py names the image from the built bundle's CFBundleShortVersionString, so the version bump never reached this build."
            ls -1 "${directory}"/*.dmg 2>/dev/null || true
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/release"
          cp "${directory}/${name}" "${directory}/${name}.sha256" "${RUNNER_TEMP}/release/"
          {
            echo "### \`${name}\`"
            echo ""
            echo "Binary slices: \`${slices}\` on \`$(uname -m)\`."
            echo ""
            echo '```'
            cat "${directory}/${name}.sha256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report the C++ object cache
        if: always()
        run: ccache --show-stats

      - name: Keep the build logs of a failed build
        # scripts/build.py prints only a filtered summary; the full tool output, which
        # names the command that failed and why, is under artifacts/build/.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ inputs.tag || github.run_id }}-${{ matrix.arch }}
          path: artifacts/build/
          if-no-files-found: ignore
          retention-days: 14

      - name: Hand the image to publish
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ inputs.tag || github.run_id }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          # A disk image is already compressed.
          compression-level: 0
          retention-days: 7

  test:
    if: ${{ inputs.validate_only == false }}
    # The same gate `python3 scripts/test.py` is locally. It needs the renderer and the
    # generated bridge, not the Release app, so it builds only those and then the Debug
    # app and tests, on its own runner while `build` produces the Release image. macOS
    # 26, where actool compiles the app icon the Debug app carries.
    runs-on: macos-26
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          # scripts/tests read the history the way the release scripts do.
          fetch-depth: 0

      - uses: ./.github/actions/prepare-build

      - name: Build the renderer and bridge
        run: python3 scripts/build.py --renderer-only

      - name: Rust release checks
        run: python3 scripts/check_rust.py

      - name: Renderer regressions without a desktop
        # Standard hosted Macs may have no Metal device. Only the separate
        # capability probe's explicit exit 77 may skip GPU targets; started
        # tests still fail on compile/parse/draw errors and timeouts. Hosted
        # VMs deliver 10 ms waits 50-100 ms late; only the timer probe's exit
        # 77 may skip the named wall-clock cadence tests.
        run: python3 scripts/check_renderer.py --allow-missing-gpu --allow-imprecise-timers

      - name: Test
        # One test class at a time. In parallel, offscreen control-panel suites failed here
        # (never locally) with "InvalidTransition … failed(deinit)": WebKit dropped a
        # JavaScript call unanswered. Here serial costs almost nothing: 300 s for the 1.2.0
        # gate against 278 s in parallel (locally it is 220 s against 50 s).
        run: python3 scripts/test.py --serial

      - name: Report the C++ object cache
        if: always()
        run: ccache --show-stats

      - name: Collect crash and jetsam reports of a failed test run
        # Says whether a web content process crashed or was killed for memory.
        if: failure()
        run: |
          mkdir -p artifacts/tests/reports
          find ~/Library/Logs/DiagnosticReports /Library/Logs/DiagnosticReports -maxdepth 1 -type f \
            \( -name '*WebContent*' -o -name '*WebKit*' -o -name 'WallpaperMachine*' -o -name 'JetsamEvent*' \) \
            -mmin -180 -exec cp {} artifacts/tests/reports/ \; 2>/dev/null || true
          ls -l artifacts/tests/reports

      - name: Keep the logs of a failed test run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ inputs.tag }}
          path: |
            artifacts/build/
            artifacts/rust/
            artifacts/renderer/adaptive-*/
            artifacts/tests/*.log
            artifacts/tests/reports/
          if-no-files-found: ignore
          retention-days: 14

  publish:
    needs: [build, test]
    # An explicit if replaces the default "skip when a dependency failed", so both
    # results are checked here. Validation runs skip publish; a release still waits
    # for the arm64 image, the Intel image and the test gate.
    if: ${{ inputs.validate_only == false && needs.build.result == 'success' && needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Builds remain per-tag and parallel; publication is repository-wide so the
    # post-upload Latest decision cannot race another version's promotion.
    # Queue waiting releases, rather than replacing the one pending job.
    concurrency:
      group: release-promotion-${{ github.repository }}
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
      # actions/attest-build-provenance signs with a workflow OIDC token and records
      # the attestation against the repository.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          pattern: release-${{ inputs.tag }}-*
          path: ${{ runner.temp }}/release
          merge-multiple: true

      - name: Check both disk images
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          directory="${RUNNER_TEMP}/release"
          for arch in arm64 x86_64; do
            name="WallpaperMachine-${version}-${arch}.dmg"
            if [ ! -f "${directory}/${name}" ]; then
              echo "::error::No ${name} in the release artifacts."
              ls -1 "${directory}" || true
              exit 1
            fi
            # The sidecar was written on the build runner; the image must still match it.
            (cd "${directory}" && sha256sum -c "${name}.sha256")
            echo "### \`${name}\`" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Attest the build provenance
        # The SLSA predicate records this workflow run and the revision that
        # triggered it. For a Version-produced tag that trigger is the push to main,
        # not the bump commit the tag points at, so the attestation identifies the
        # run and the builder, not the built source. The notes carry the built
        # revision instead, and it is checkable against the tag. Both images are
        # subjects; each was built on its own runner in this same run.
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ runner.temp }}/release/WallpaperMachine-*.dmg

      - name: Write the update manifest
        id: manifest
        # The updater reads this asset through github.com's releases/latest/download
        # redirect, which the 60-an-hour anonymous API limit does not count; releases
        # without it are read from the API. Derived from the tag, the notes that become
        # the release body and both image files checked above.
        env:
          TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          directory="${RUNNER_TEMP}/release"
          manifest="$(python3 scripts/update_manifest.py --tag "$TAG" --repository "$REPOSITORY" \
            --notes "${directory}/notes.md" \
            "${directory}/WallpaperMachine-${version}-arm64.dmg" \
            "${directory}/WallpaperMachine-${version}-x86_64.dmg")"
          echo "manifest=${manifest}" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          MANIFEST: ${{ steps.manifest.outputs.manifest }}
        # Drafts first, a live release is refused rather than clobbered, and Latest
        # is claimed only when no greater version is public: scripts/publish_release.py,
        # covered by scripts/tests/test_publish_release.py.
        run: |
          set -euo pipefail
          version="${TAG#v}"
          directory="${RUNNER_TEMP}/release"
          python3 scripts/publish_release.py --tag "$TAG" --notes "${directory}/notes.md" \
            "${directory}/WallpaperMachine-${version}-arm64.dmg" \
            "${directory}/WallpaperMachine-${version}-arm64.dmg.sha256" \
            "${directory}/WallpaperMachine-${version}-x86_64.dmg" \
            "${directory}/WallpaperMachine-${version}-x86_64.dmg.sha256" \
            "$MANIFEST"
