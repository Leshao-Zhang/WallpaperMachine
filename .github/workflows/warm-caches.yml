# Keep the release build's caches alive between releases.
#
# GitHub evicts a cache entry nobody has read for seven days, and a release after a
# quiet week would then rebuild FFmpeg, the C++ scene engine and the renderer from
# nothing. This builds the renderer through the same setup Build uses, which reads
# every entry and refreshes the C++ object cache. Scheduled runs use main, whose
# caches every ref, including release tags, can read. It publishes nothing. The
# Intel release runner has its own entries: an arm64 cache must not be restored there.
name: Warm caches

on:
  schedule:
    # Twice a week keeps every entry well inside the seven-day window.
    - cron: "17 3 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warm-caches
  cancel-in-progress: true

jobs:
  warm:
    # Build's release jobs run on macOS 15 (arm64 and Intel) and its test job on
    # macOS 26. Cache keys include the CPU, so each runner keeps its own entries.
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/prepare-build

      - name: Build the renderer and bridge
        run: python3 scripts/build.py --renderer-only

      - name: Report the C++ object cache
        if: always()
        run: ccache --show-stats
